name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test --no-daemon

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Google Phone call recording patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: ${{ always() && steps.release.outputs.new_release_published != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      # Keep the tested .mpp available even when GitHub rejects semantic-release
      # refs/notes. This is a CI artifact, not a public GitHub Release asset.
      - name: Upload compiled patch bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: google-phone-mpp-${{ github.run_id }}
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: warn
          retention-days: 30
